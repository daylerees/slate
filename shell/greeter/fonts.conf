<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- System fonts plus the copies of your fonts made by slate-greeter-sync -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/var/lib/slate-greeter/fonts</dir>
  <cachedir>/var/cache/slate-greeter/fontconfig</cachedir>
</fontconfig>
