# Slate's starting Ghostty config
#
# Slate made this because you had no Ghostty config of your own (Settings → Appearance →
# App theming). It's yours now: change anything. Switching Ghostty off in App theming
# deletes this file if you haven't changed it, or just the theme line below if you have.

# ---- Look ----
# See-through, so Hyprland's blur shows behind the window
background-opacity = 0.6
# Room between the text and the window's edges (pixels)
window-padding-x = 25
window-padding-y = 25

# ---- Copy and paste ----
# Selecting text copies it
copy-on-select = clipboard

# ---- Colours ----
# Slate's colours (themes/slate), rewritten whenever Slate's theme changes
theme = slate
