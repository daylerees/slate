# Slate's starting kitty config
#
# Slate made this because you had no kitty config of your own (Settings → Appearance →
# App theming). It's yours now: change anything. Switching kitty off in App theming
# deletes this file if you haven't changed it, or just the theme line below if you have.

# ---- Look ----
# See-through, so Hyprland's blur shows behind the window
background_opacity          0.6
# Room between the text and the window's edges (pixels)
window_padding_width        25
# The cursor leaves a short trail when it jumps
cursor_trail                1

# ---- Copy and paste ----
# Ctrl+C copies when text is selected and interrupts the program otherwise; Ctrl+V pastes
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# ---- Colours ----
# Slate's colours, rewritten whenever Slate's theme changes. Keep this line last so the
# theme wins over anything above it.
include themes/slate.conf
