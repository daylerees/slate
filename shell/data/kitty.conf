# Slate's starting kitty config, made when you have no
# ~/.config/kitty/kitty.conf. It's yours now: change anything. Slate's colours come from
# themes/slate.conf, which Slate rewrites when its theme changes.

# See-through, so Hyprland's blur shows behind it; room around the text
background_opacity          0.6
window_padding_width        25
cursor_trail                1

# Copy/paste without shift: ctrl+c copies if text is selected, otherwise sends interrupt
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

include themes/slate.conf
