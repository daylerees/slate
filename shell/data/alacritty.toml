# Slate's starting Alacritty config
#
# Slate made this because you had no Alacritty config of your own (Settings → Appearance →
# App theming). It's yours now: change anything. Switching Alacritty off in App theming
# deletes this file if you haven't changed it, or just the theme import if you have.

[general]
# Slate's colours, rewritten whenever Slate's theme changes
import = ["~/.config/alacritty/themes/slate.toml"]
# Pick up changes to this file (and Slate's colours) without restarting
live_config_reload = true

[window]
# See-through, so Hyprland's blur shows behind the window
opacity = 0.6
# Room between the text and the window's edges (pixels), spread evenly
padding = { x = 25, y = 25 }
dynamic_padding = true

[selection]
# Selecting text copies it, like kitty's Ctrl+C
save_to_clipboard = true
