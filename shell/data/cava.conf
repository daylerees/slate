# Slate's starting cava config
#
# Slate made this because you had no cava config of your own (Settings → Appearance →
# App theming). It's yours now: change anything (every option is listed at
# https://github.com/karlstav/cava). Slate sets the gradient in [color] to its own
# colours and updates it whenever its theme changes; switching cava off in App theming
# puts those settings back.

[color]
# Slate's colours: a gradient from its theme (set below by Slate, updated with the theme)
