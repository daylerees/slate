include=~/.config/foot/slate.ini
# Slate's colours (slate.ini, above), rewritten whenever Slate's theme changes. The include
# has to come first, before any [section].
#
# Slate's starting foot config
#
# Slate made this because you had no foot config of your own (Settings → Appearance →
# App theming). It's yours now: change anything. Switching foot off in App theming
# deletes this file if you haven't changed it, or just the include line if you have.

[main]
# Room between the text and the window's edges (pixels)
pad=25x25

[colors]
# See-through, so Hyprland's blur shows behind the window
alpha=0.6
