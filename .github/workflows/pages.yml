# Publishes the project site (site/) to GitHub Pages: https://daylerees.github.io/slate/
# The site uses Slate's own fonts, copied in from shell/fonts when it's built.
# (Repo settings → Pages → Source: GitHub Actions)
name: Site

on:
  push:
    branches: [master]
    paths: ["site/**", "shell/fonts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p _site/fonts
          cp -r site/. _site/
          cp shell/fonts/Geist-Variable.ttf shell/fonts/tabler.ttf _site/fonts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
