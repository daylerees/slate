# Publishes the project site (site/) to GitHub Pages: https://daylerees.github.io/slate/
# The site uses Slate's own fonts, copied in from shell/fonts when it's built.
# (Repo settings → Pages → Source: GitHub Actions)
name: Site

on:
  push:
    branches: [master]
    paths: ["site/**", "shell/fonts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build
        run: |
          mkdir -p _site/fonts
          cp -r site/. _site/
          cp shell/fonts/Geist-Variable.ttf shell/fonts/tabler.ttf _site/fonts/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
